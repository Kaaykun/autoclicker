name: Release

# Tag a commit to build:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's macOS runners are Apple Silicon, so this build is too.
          # Intel Macs should run from source.
          - os: macos-latest
            artifact: Autoclicker-macOS-AppleSilicon
          - os: windows-latest
            artifact: Autoclicker-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked

      # iconutil only exists on macOS, so the .icns is produced here rather
      # than committed. The .ico is written on either platform.
      - name: Build icons
        run: uv run python tools/make_icons.py

      - name: Build app
        run: uv run pyinstaller --noconfirm autoclicker.spec

      # The unit tests all run against the source tree, where every import
      # trivially resolves. They cannot see a module PyInstaller failed to
      # bundle -- which is how a build once shipped with no PySide6 in it at
      # all. So run the frozen binary itself before uploading it.
      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/Autoclicker.app/Contents/MacOS/Autoclicker --self-test

      # The Windows build is windowed, so it detaches from the console: the
      # shell would not wait for it and would never see its output. Hence
      # Start-Process -Wait and the log file.
      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        env:
          AUTOCLICKER_SELFTEST_LOG: selftest.log
        run: |
          $run = Start-Process -FilePath dist/Autoclicker/Autoclicker.exe `
            -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.log) { Get-Content selftest.log }
          else { Write-Host 'the app wrote no self-test log' }
          exit $run.ExitCode

      # ditto, not zip: it is Apple's own archiver and preserves the
      # symlinks and bundle metadata inside a .app that a plain zip mangles.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Autoclicker.app ${{ matrix.artifact }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Autoclicker/* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          # These builds are unsigned. Say so where people will actually read it.
          body: |
            ## Install

            **macOS** (Apple Silicon) — download the macOS zip, unzip it, drag
            `Autoclicker.app` into Applications.

            These builds are unsigned, so the first launch is blocked. Double-click
            the app, let macOS refuse, then open **System Settings → Privacy &
            Security**, scroll to Security, and click **Open Anyway** next to the
            message about Autoclicker. The button is only there for about an hour
            after you tried to open it.

            Then grant it two permissions under the same Privacy & Security
            settings — **Accessibility** (to send clicks) and **Input Monitoring**
            (for the hotkeys) — and restart the app.

            macOS ties those permissions to the exact binary, and every unsigned
            update is a new binary, so you will have to grant them again after each
            update.

            **Windows** — download the Windows zip, unzip it anywhere, run
            `Autoclicker.exe`. SmartScreen warns on first run: **More info** →
            **Run anyway**. No permissions to grant. To click into an app running
            as administrator, run Autoclicker as administrator too.
          generate_release_notes: true
