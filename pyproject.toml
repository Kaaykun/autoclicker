[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclicker"
version = "0.1.0"
description = "Cross-platform auto-clicker with precise intervals, targeting, hotkeys and safety controls"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jaris Fenner" }]
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autoclicker = "autoclicker.__main__:main"

[tool.setuptools.packages.find]
include = ["autoclicker*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
