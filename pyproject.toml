[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclicker"
version = "0.1.1"
description = "Cross-platform auto-clicker with precise intervals, targeting, hotkeys and safety controls"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jaris Fenner" }]
# PySide6-Essentials rather than the full PySide6: this app imports only
# QtCore, QtGui and QtWidgets, and the Addons half is several hundred megabytes
# that would otherwise end up inside every packaged build.
dependencies = [
    "PySide6-Essentials>=6.6",
    "pynput>=1.7.6",
]

# Dev tooling goes in a dependency group (PEP 735), not an optional-dependency
# extra: it is not something a consumer of this package would ever install, and
# `uv sync` picks up the dev group by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # Building the icon sets and the packaged app.
    "pillow>=10.0",
    "numpy>=1.26",
    "pyinstaller>=6.6",
]

[project.scripts]
autoclicker = "autoclicker.__main__:main"

[tool.setuptools.packages.find]
include = ["autoclicker*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
